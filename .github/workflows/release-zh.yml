name: Release ZH Desktop

on:
  push:
    branches:
      - cn
      - cn-nightly
    tags:
      - "v*-zh"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "上游版本标签（如 v0.1.10 或 v0.1.11-nightly.20261117.4825；留空则自动读取当前分支已合并的最新上游标签）"
        required: false
        default: ""
        type: string
      prerelease:
        description: "是否标记为 Pre-release（auto 按版本号自动判断）"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - "true"
          - "false"
      force_rebuild:
        description: "即使对应 -zh Release 已存在完整安装包也强制重打并覆盖"
        required: false
        default: true
        type: boolean
      artifact_run_id:
        description: "复用指定发布 Run 已构建的附件（留空则重新构建）"
        required: false
        type: string

concurrency:
  group: release-zh-${{ github.ref_name }}-${{ inputs.upstream_tag || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve ZH release target
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      upstream_tag: ${{ steps.meta.outputs.upstream_tag }}
      version: ${{ steps.meta.outputs.version }}
      fork_tag: ${{ steps.meta.outputs.fork_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      manifest_name: ${{ steps.meta.outputs.manifest_name }}
    steps:
      - name: Checkout commit history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            package.json
            .github/release-notes/
          sparse-checkout-cone-mode: false

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --tags --no-recurse-submodules https://github.com/pingdotgg/t3code.git

          if ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "tag" -and $env:REF_NAME.EndsWith("-zh")) {
            $rawTag = $env:REF_NAME.Substring(0, $env:REF_NAME.Length - 3)
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $rawTag = $env:INPUT_TAG.Trim()
            if ($rawTag.EndsWith("-zh")) {
              $rawTag = $rawTag.Substring(0, $rawTag.Length - 3)
            }
          } else {
            $wantsNightly = ($env:INPUT_PRERELEASE -eq "true") -or ($env:REF_NAME -match "nightly")
            $mergedTags = git tag --merged HEAD --sort=-v:refname
            if ($wantsNightly) {
              $rawTag = $mergedTags | Where-Object { $_ -notmatch '-zh$' -and $_ -match '^v\d+\.\d+\.\d+-(nightly|rc|beta|alpha)\.[0-9A-Za-z.]+$' } | Select-Object -First 1
            } else {
              $rawTag = $mergedTags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
            }
            if (-not $rawTag) {
              throw "Could not find any merged upstream release tag on ref '$env:REF_NAME'."
            }
          }

          if (-not $rawTag.StartsWith("v")) {
            $rawTag = "v$rawTag"
          }
          $ver = $rawTag.Substring(1)
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid semantic version resolved from tag '$rawTag': '$ver'"
          }

          $forkTag = "$rawTag-zh"
          if ($env:INPUT_PRERELEASE -eq "true") {
            $isPrerelease = "true"
          } elseif ($env:INPUT_PRERELEASE -eq "false") {
            $isPrerelease = "false"
          } elseif ($ver.Contains("-")) {
            $isPrerelease = "true"
          } else {
            $isPrerelease = "false"
          }

          $manifestName = if ($ver -match '-nightly\.\d{8}\.\d+$') { "nightly.yml" } else { "latest.yml" }
          $exeName = "T3-Code-$ver-x64.exe"
          $notesFile = ".github/release-notes/$rawTag.md"
          $expectedAssets = @($exeName, "$exeName.blockmap", $manifestName)
          if (Test-Path -LiteralPath $notesFile -PathType Leaf) {
            $expectedAssets += "T3-Code-$ver-arm64.dmg", "T3-Code-$ver-android.apk"
          }

          $shouldBuild = "true"
          $isBranchPush = ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "branch")
          $allowSkipExisting = $isBranchPush -or ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:FORCE_REBUILD -eq "false")

          if ($allowSkipExisting) {
            $existingJson = gh release view $forkTag --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
            if ($LASTEXITCODE -eq 0 -and $existingJson) {
              $existing = $existingJson | ConvertFrom-Json
              $assetNames = @($existing.assets | Where-Object { $_.state -eq "uploaded" } | ForEach-Object { $_.name })
              $missingAssets = @($expectedAssets | Where-Object { $_ -notin $assetNames })
              if ((-not $existing.isDraft) -and $missingAssets.Count -eq 0) {
                $shouldBuild = "false"
                Write-Host "Release $forkTag already has all expected assets uploaded; skipping build."
              }
            }
          }

          if ($shouldBuild -eq "true") {
            if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf) -or
                [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notesFile -Raw))) {
              throw "Add the translated upstream release notes at $notesFile before publishing."
            }
          }

          "should_build=$shouldBuild" >> $env:GITHUB_OUTPUT
          "upstream_tag=$rawTag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          "fork_tag=$forkTag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          "manifest_name=$manifestName" >> $env:GITHUB_OUTPUT

          Write-Host "Resolved: should_build=$shouldBuild upstream_tag=$rawTag version=$ver fork_tag=$forkTag is_prerelease=$isPrerelease manifest=$manifestName"

  build-windows-x64:
    name: Build Windows x64
    needs: [resolve]
    if: needs.resolve.outputs.should_build == 'true' && !inputs.artifact_run_id
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve pnpm store path
        id: pnpm_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm_cache_path.outputs.path }}
          key: zh-release-pnpm-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            zh-release-pnpm-v1-${{ runner.os }}-

      - name: Install dependencies
        shell: pwsh
        run: vp install

      - name: Verify i18n translations
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $syncOut = vp exec node i18n/sync.mjs
          $syncOut | ForEach-Object { Write-Host $_ }
          if (($syncOut -join "`n") -match 'Missing:\s*[1-9]') {
            throw "Untranslated i18n keys detected; aborting release build."
          }

      - name: Cache Rust resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: zh-resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust toolchain
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build Rust resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Windows x64 installer
        shell: pwsh
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_VERSION: ${{ needs.resolve.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsudDMuY29kZXMk' }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE || 't3-relay' }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID || 'hzxSgY2cH10sDU2r' }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL || 'https://relay.t3.codes' }}
        run: |
          $ErrorActionPreference = "Stop"
          $shortTmp = if (Test-Path "D:\") { "D:\t3tmp" } else { "C:\t3tmp" }
          New-Item -ItemType Directory -Force -Path $shortTmp | Out-Null
          $env:TEMP = $shortTmp
          $env:TMP = $shortTmp
          vp run dist:desktop:win:x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            release/T3-Code-${{ needs.resolve.outputs.version }}-x64.exe
            release/T3-Code-${{ needs.resolve.outputs.version }}-x64.exe.blockmap
            release/${{ needs.resolve.outputs.manifest_name }}
          if-no-files-found: error
          compression-level: 0

  build-macos-arm64:
    name: Build macOS arm64
    needs: [resolve]
    if: needs.resolve.outputs.should_build == 'true' && !inputs.artifact_run_id
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build macOS disk image
        env:
          T3CODE_DESKTOP_VERSION: ${{ needs.resolve.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsudDMuY29kZXMk' }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE || 't3-relay' }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID || 'hzxSgY2cH10sDU2r' }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL || 'https://relay.t3.codes' }}
        run: vp run dist:desktop:dmg:arm64

      - name: Upload macOS disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: release/T3-Code-${{ needs.resolve.outputs.version }}-arm64.dmg
          if-no-files-found: error
          compression-level: 0

  build-android:
    name: Build Android APK
    needs: [resolve]
    if: needs.resolve.outputs.should_build == 'true' && !inputs.artifact_run_id
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - run: vp install --frozen-lockfile

      - name: Build standalone APK
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          EXPO_NO_GIT_STATUS: "1"
          T3CODE_ANDROID_PACKAGE: com.amazingdm.t3code
          T3CODE_ANDROID_VERSION_CODE: ${{ github.run_number }}
          T3CODE_MOBILE_VERSION: ${{ needs.resolve.outputs.version }}
          T3CODE_MOBILE_UPDATES_ENABLED: "0"
          EXPO_PUBLIC_T3CODE_DEFAULT_LOCALE: zh
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsudDMuY29kZXMk' }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE || 't3-relay' }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID || 'hzxSgY2cH10sDU2r' }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL || 'https://relay.t3.codes' }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          vp exec expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign and verify the APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.RELEASE_ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_ANDROID_KEYSTORE_PASSWORD }}
          VER: ${{ needs.resolve.outputs.version }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure the Android release signing secrets."
            exit 1
          fi
          keystore="$RUNNER_TEMP/t3code-android.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$keystore"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          unsigned=(apps/mobile/android/app/build/outputs/apk/release/*.apk)
          test "${#unsigned[@]}" -eq 1 && test -f "${unsigned[0]}"
          apk="release/T3-Code-$VER-android.apk"
          mkdir -p release
          "$signer" sign --ks "$keystore" --ks-key-alias t3code \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out "$apk" "${unsigned[0]}"
          "$signer" verify "$apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: release/T3-Code-${{ needs.resolve.outputs.version }}-android.apk
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [resolve, build-windows-x64, build-macos-arm64, build-android]
    if: >-
      !cancelled() && needs.resolve.outputs.should_build == 'true' &&
      (inputs.artifact_run_id ||
       (needs.build-windows-x64.result == 'success' &&
        needs.build-macos-arm64.result == 'success' &&
        needs.build-android.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve artifact source
        id: artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.artifact_run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $runId = $env:GITHUB_RUN_ID
          $sha = $env:GITHUB_SHA
          if ($env:INPUT_RUN) {
            if ($env:INPUT_RUN -notmatch '^\d+$') { throw "Invalid artifact Run ID." }
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INPUT_RUN" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($run.path -ne ".github/workflows/release-zh.yml" -or
                $run.head_branch -ne $env:GITHUB_REF_NAME -or $run.status -ne "completed") {
              throw "Choose a completed release-zh.yml run on $env:GITHUB_REF_NAME."
            }
            $runId = $run.id
            $sha = $run.head_sha
          }
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifacts.outputs.run_id }}
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          VER: ${{ needs.resolve.outputs.version }}
          FORK_TAG: ${{ needs.resolve.outputs.fork_tag }}
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
          MANIFEST_NAME: ${{ needs.resolve.outputs.manifest_name }}
          RELEASE_SHA: ${{ steps.artifacts.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "release/T3-Code-$env:VER-x64.exe"
          $blockmap = "release/T3-Code-$env:VER-x64.exe.blockmap"
          $manifest = "release/$env:MANIFEST_NAME"

          $dmg = "release/T3-Code-$env:VER-arm64.dmg"
          $apk = "release/T3-Code-$env:VER-android.apk"
          $assets = @($exe, $blockmap, $manifest, $dmg, $apk)
          foreach ($file in $assets) {
            if (-not (Test-Path $file)) {
              throw "Expected build artifact missing: $file"
            }
          }

          $title = "T3 Code $env:UPSTREAM_TAG"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes = gh api --method GET "repos/$env:GITHUB_REPOSITORY/contents/.github/release-notes/$env:UPSTREAM_TAG.md" -f ref=$env:RELEASE_SHA -H "Accept: application/vnd.github.raw+json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notes | Set-Content -LiteralPath $notesFile -Encoding utf8

          $exists = $false
          gh release view $env:FORK_TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $exists = $true
          }

          if ($exists) {
            gh release upload $env:FORK_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($env:IS_PRERELEASE -eq "true") {
              gh release edit $env:FORK_TAG --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesFile --prerelease --draft=false
            } else {
              gh release edit $env:FORK_TAG --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesFile --prerelease=false --latest --draft=false
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $createArgs = @(
              "release", "create", $env:FORK_TAG,
              "--repo", $env:GITHUB_REPOSITORY,
              "--target", $env:RELEASE_SHA,
              "--title", $title,
              "--notes-file", $notesFile
            )
            if ($env:IS_PRERELEASE -eq "true") {
              $createArgs += "--prerelease"
            } else {
              $createArgs += "--latest"
            }
            & gh @createArgs @assets
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $rel = gh release view $env:FORK_TAG --repo $env:GITHUB_REPOSITORY --json tagName,url,isDraft,isPrerelease,assets | ConvertFrom-Json
          $summary = @(
            "### $title",
            "- **Release URL**: $($rel.url)",
            "- **Pre-release**: $($rel.isPrerelease)",
            "- **Assets**:",
            ($rel.assets | ForEach-Object { "  - ``$($_.name)`` ($($_.size) bytes, $($_.state))" })
          ) -join "`n"
          $summary >> $env:GITHUB_STEP_SUMMARY
