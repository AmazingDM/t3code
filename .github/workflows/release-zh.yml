name: Release ZH Desktop

on:
  push:
    branches:
      - cn
      - cn-nightly
    tags:
      - "v*-zh"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "上游版本标签（如 v0.1.10 或 v0.1.11-nightly.20261117.4825；留空则自动读取当前分支已合并的最新上游标签）"
        required: false
        default: ""
        type: string
      prerelease:
        description: "是否标记为 Pre-release（auto 按版本号自动判断）"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - "true"
          - "false"
      force_rebuild:
        description: "即使对应 -zh Release 已存在完整安装包也强制重打并覆盖"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-zh-${{ github.ref_name }}-${{ inputs.upstream_tag || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve ZH release target
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      upstream_tag: ${{ steps.meta.outputs.upstream_tag }}
      version: ${{ steps.meta.outputs.version }}
      fork_tag: ${{ steps.meta.outputs.fork_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      manifest_name: ${{ steps.meta.outputs.manifest_name }}
    steps:
      - name: Checkout commit history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            package.json
            .github/release-notes/
          sparse-checkout-cone-mode: false

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --tags --no-recurse-submodules https://github.com/pingdotgg/t3code.git

          if ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "tag" -and $env:REF_NAME.EndsWith("-zh")) {
            $rawTag = $env:REF_NAME.Substring(0, $env:REF_NAME.Length - 3)
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $rawTag = $env:INPUT_TAG.Trim()
            if ($rawTag.EndsWith("-zh")) {
              $rawTag = $rawTag.Substring(0, $rawTag.Length - 3)
            }
          } else {
            $wantsNightly = ($env:INPUT_PRERELEASE -eq "true") -or ($env:REF_NAME -match "nightly")
            $mergedTags = git tag --merged HEAD --sort=-v:refname
            if ($wantsNightly) {
              $rawTag = $mergedTags | Where-Object { $_ -notmatch '-zh$' -and $_ -match '^v\d+\.\d+\.\d+-(nightly|rc|beta|alpha)\.[0-9A-Za-z.]+$' } | Select-Object -First 1
            } else {
              $rawTag = $mergedTags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
            }
            if (-not $rawTag) {
              throw "Could not find any merged upstream release tag on ref '$env:REF_NAME'."
            }
          }

          if (-not $rawTag.StartsWith("v")) {
            $rawTag = "v$rawTag"
          }
          $ver = $rawTag.Substring(1)
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid semantic version resolved from tag '$rawTag': '$ver'"
          }

          $forkTag = "$rawTag-zh"
          if ($env:INPUT_PRERELEASE -eq "true") {
            $isPrerelease = "true"
          } elseif ($env:INPUT_PRERELEASE -eq "false") {
            $isPrerelease = "false"
          } elseif ($ver.Contains("-")) {
            $isPrerelease = "true"
          } else {
            $isPrerelease = "false"
          }

          $manifestName = if ($ver -match '-nightly\.\d{8}\.\d+$') { "nightly.yml" } else { "latest.yml" }
          $exeName = "T3-Code-$ver-x64.exe"

          $shouldBuild = "true"
          $isBranchPush = ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "branch")
          $allowSkipExisting = $isBranchPush -or ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:FORCE_REBUILD -eq "false")

          if ($allowSkipExisting) {
            $existingJson = gh release view $forkTag --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
            if ($LASTEXITCODE -eq 0 -and $existingJson) {
              $existing = $existingJson | ConvertFrom-Json
              $assetNames = @($existing.assets | Where-Object { $_.state -eq "uploaded" } | ForEach-Object { $_.name })
              if ((-not $existing.isDraft) -and ($assetNames -contains $exeName) -and ($assetNames -contains $manifestName)) {
                $shouldBuild = "false"
                Write-Host "Release $forkTag already has $exeName and $manifestName uploaded; skipping build."
              }
            }
          }

          if ($shouldBuild -eq "true") {
            $notesFile = ".github/release-notes/$rawTag.md"
            if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf) -or
                [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notesFile -Raw))) {
              throw "Add the translated upstream release notes at $notesFile before publishing."
            }
          }

          "should_build=$shouldBuild" >> $env:GITHUB_OUTPUT
          "upstream_tag=$rawTag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          "fork_tag=$forkTag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          "manifest_name=$manifestName" >> $env:GITHUB_OUTPUT

          Write-Host "Resolved: should_build=$shouldBuild upstream_tag=$rawTag version=$ver fork_tag=$forkTag is_prerelease=$isPrerelease manifest=$manifestName"

  build-windows-x64:
    name: Build & Publish Windows x64 (ZH)
    needs: [resolve]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve pnpm store path
        id: pnpm_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm_cache_path.outputs.path }}
          key: zh-release-pnpm-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            zh-release-pnpm-v1-${{ runner.os }}-

      - name: Install dependencies
        shell: pwsh
        run: vp install

      - name: Verify i18n translations
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $syncOut = vp exec node i18n/sync.mjs
          $syncOut | ForEach-Object { Write-Host $_ }
          if (($syncOut -join "`n") -match 'Missing:\s*[1-9]') {
            throw "Untranslated i18n keys detected; aborting release build."
          }

      - name: Cache Rust resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: zh-resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust toolchain
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build Rust resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Windows x64 installer
        shell: pwsh
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_VERSION: ${{ needs.resolve.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsudDMuY29kZXMk' }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE || 't3-relay' }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID || 'hzxSgY2cH10sDU2r' }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL || 'https://relay.t3.codes' }}
        run: |
          $ErrorActionPreference = "Stop"
          $shortTmp = if (Test-Path "D:\") { "D:\t3tmp" } else { "C:\t3tmp" }
          New-Item -ItemType Directory -Force -Path $shortTmp | Out-Null
          $env:TEMP = $shortTmp
          $env:TMP = $shortTmp
          vp run dist:desktop:win:x64

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          VER: ${{ needs.resolve.outputs.version }}
          FORK_TAG: ${{ needs.resolve.outputs.fork_tag }}
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
          MANIFEST_NAME: ${{ needs.resolve.outputs.manifest_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "release/T3-Code-$env:VER-x64.exe"
          $blockmap = "release/T3-Code-$env:VER-x64.exe.blockmap"
          $manifest = "release/$env:MANIFEST_NAME"

          foreach ($file in @($exe, $blockmap, $manifest)) {
            if (-not (Test-Path $file)) {
              throw "Expected build artifact missing: $file"
            }
          }

          $title = "T3 Code $env:UPSTREAM_TAG"
          $notesFile = ".github/release-notes/$env:UPSTREAM_TAG.md"

          $exists = $false
          gh release view $env:FORK_TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $exists = $true
          }

          if ($exists) {
            gh release upload $env:FORK_TAG $exe $blockmap $manifest --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($env:IS_PRERELEASE -eq "true") {
              gh release edit $env:FORK_TAG --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesFile --prerelease --draft=false
            } else {
              gh release edit $env:FORK_TAG --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesFile --prerelease=false --latest --draft=false
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $createArgs = @(
              "release", "create", $env:FORK_TAG,
              $exe, $blockmap, $manifest,
              "--repo", $env:GITHUB_REPOSITORY,
              "--target", $env:GITHUB_SHA,
              "--title", $title,
              "--notes-file", $notesFile
            )
            if ($env:IS_PRERELEASE -eq "true") {
              $createArgs += "--prerelease"
            } else {
              $createArgs += "--latest"
            }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $rel = gh release view $env:FORK_TAG --repo $env:GITHUB_REPOSITORY --json tagName,url,isDraft,isPrerelease,assets | ConvertFrom-Json
          $summary = @(
            "### $title",
            "- **Release URL**: $($rel.url)",
            "- **Pre-release**: $($rel.isPrerelease)",
            "- **Assets**:",
            ($rel.assets | ForEach-Object { "  - ``$($_.name)`` ($($_.size) bytes, $($_.state))" })
          ) -join "`n"
          $summary >> $env:GITHUB_STEP_SUMMARY
